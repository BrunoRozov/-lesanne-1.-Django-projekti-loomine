<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Avaleht</title>
</head>
<body>
    <h1>{{ pealkiri }}</h1>
    <ul>
        {% for raamat in raamatud %}
            <li>
                <strong>{{ raamat.nimi }}</strong>
                - autor: {{ raamat.autor }}

                {% if raamat.saadaval == True %}
                    <p>Saadaval</p> 

                {% else %}
                    <p>Pole saadaval</p>

                {% endif %}
                
            </li>
        {% endfor %}
    </ul>
</body>
</html>
